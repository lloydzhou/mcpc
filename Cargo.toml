[package]
name = "mcpc"
version = "0.2.0"
edition = "2021"
authors = ["Lloyd Zhou <lloydzhou@gmail.com>"]
license = "MIT"
description = "MCP client CLI with daemon-held sessions"
repository = "https://github.com/lloydzhou/mcpc"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
libc = "0.2"
rmcp = { version = "3.3", features = [
  "client",
  "transport-streamable-http-client-reqwest",
  "reqwest",
  "transport-child-process",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
http = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
